name: Eagle One-Time Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-smoke.yml'

permissions:
  contents: read

concurrency:
  group: eagle-one-time-smoke
  cancel-in-progress: false

jobs:
  dry-run-10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eagle main.py
      - run: python -m pytest -q
      - name: Run 10-row dry run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          APPLY_CHANGES: 'false'
          ARCHIVE_REJECTED: 'false'
          MAX_ROWS: '10'
          URL_CHECK_ENABLED: 'true'
        run: python -m eagle
      - name: Upload 10-row dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-dry-run-10-${{ github.run_number }}
          path: |
            output/report.json
            output/report.csv
          if-no-files-found: warn
          retention-days: 14
