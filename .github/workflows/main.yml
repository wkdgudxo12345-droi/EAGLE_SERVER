name: Eagle Server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Write validated scores to Notion
        required: true
        default: false
        type: boolean
      archive_rejected:
        description: Archive hard-rejected rows (requires apply_changes)
        required: true
        default: false
        type: boolean
      max_rows:
        description: Optional row limit for a smoke run
        required: false
        type: string
  schedule:
    # 01:00, 09:00 and 17:00 Asia/Kuala_Lumpur (UTC+8)
    - cron: "0 17,1,9 * * *"

permissions:
  contents: read

concurrency:
  group: eagle-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eagle main.py
      - run: python -m pytest -q

  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Eagle pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          APPLY_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes || false }}
          ARCHIVE_REJECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_rejected || false }}
          MAX_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_rows || '' }}
          URL_CHECK_ENABLED: "true"
        run: python -m eagle
      - name: Upload Eagle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-report-${{ github.run_number }}
          path: |
            output/report.json
            output/report.csv
          if-no-files-found: warn
          retention-days: 14
