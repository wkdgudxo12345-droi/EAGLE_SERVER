name: Eagle Server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm_rag:
        description: Run the optional OpenAI Red Team reasoner (uses API credits)
        required: true
        default: false
        type: boolean
      require_llm_rag:
        description: Fail instead of using deterministic RAG when the model is unavailable
        required: true
        default: false
        type: boolean
      max_rows:
        description: Optional row limit for a smoke run
        required: false
        type: string
  schedule:
    # 01:00, 09:00 and 17:00 Asia/Kuala_Lumpur (UTC+8)
    - cron: "0 17,1,9 * * *"

permissions:
  contents: read

concurrency:
  group: eagle-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eagle main.py
      - name: Run end-to-end Eagle policy smoke test
        run: python -m eagle.smoke
      - name: Run regression tests
        id: pytest
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p output
          python -m pytest -vv --tb=long --junitxml=output/pytest.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when regression tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Restore interrupted-run state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: eagle-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eagle-state-${{ github.run_id }}-
      - name: Run Eagle V4 report-only pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: "2026-03-11"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          APPLY_CHANGES: "false"
          ARCHIVE_REJECTED: "false"
          STRICT_SCHEMA: "true"
          MAX_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_rows || '' }}
          URL_CHECK_ENABLED: "true"
          URL_CHECK_TIMEOUT_SECONDS: "12"
          EAGLE_EVIDENCE_FILE: data/policy_evidence.json
          RAG_USE_LLM: ${{ github.event_name == 'workflow_dispatch' && inputs.run_llm_rag || false }}
          REQUIRE_LLM_RAG: ${{ github.event_name == 'workflow_dispatch' && inputs.require_llm_rag || false }}
          RESUME_ENABLED: "true"
          STATE_DIR: state
          OUTPUT_DIR: output
          EAGLE_RUN_KEY: ${{ github.run_id }}
          EAGLE_CODE_SHA: ${{ github.sha }}
          SOFT_DEADLINE_SECONDS: "3000"
        run: python -m eagle
      - name: Save resumable state
        if: always() && hashFiles('state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: eagle-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Eagle reports and interruption checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            state/
          if-no-files-found: warn
          retention-days: 14
