name: Eagle Server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm_rag:
        description: Run the optional OpenAI Red Team reasoner (uses API credits)
        required: true
        default: false
        type: boolean
      require_llm_rag:
        description: Fail instead of using deterministic RAG when the model is unavailable
        required: true
        default: false
        type: boolean
      promote_final:
        description: Append only fully verified and CV-ready rows to Final DB
        required: true
        default: false
        type: boolean
      candidate_work_rights:
        description: Candidate Australian work-rights state
        required: true
        default: application_in_progress
        type: choice
        options:
          - application_in_progress
          - granted
      max_rows:
        description: Optional row limit for a smoke run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eagle-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eagle main.py
      - name: Run end-to-end Eagle policy smoke test
        run: python -m eagle.smoke
      - name: Run regression tests
        id: pytest
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p output
          python -m pytest -vv --tb=long --junitxml=output/pytest.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when regression tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  pipeline:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      notion_valid: ${{ steps.notion_preflight.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Restore cross-run URL and Gmail state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: eagle-operational-state-v3-${{ github.run_id }}
          restore-keys: |
            eagle-operational-state-v3-

      - name: Read and classify Gmail recruitment outcomes
        continue-on-error: true
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FEEDBACK_OUTPUT: output/gmail_outcomes.json
          GMAIL_FEEDBACK_STATE: state/gmail_feedback_state.json
          GMAIL_MAX_MESSAGES: "50"
          CANDIDATE_WORK_RIGHTS: ${{ inputs.candidate_work_rights }}
        run: python -m eagle.gmail_feedback

      - name: Validate Notion credentials without failing feedback collection
        id: notion_preflight
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '2ca701ec-01ea-4dfb-864f-a2f7175e5e66' }}
          NOTION_VERSION: "2026-03-11"
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("NOTION_TOKEN", "").strip()
          source_id = os.getenv("NOTION_DATA_SOURCE_ID", "").replace("-", "").strip()
          valid = False
          reason = "NOTION_TOKEN secret is missing"
          if token and source_id:
              try:
                  response = requests.get(
                      f"https://api.notion.com/v1/data_sources/{source_id}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Notion-Version": os.getenv("NOTION_VERSION", "2026-03-11"),
                      },
                      timeout=15,
                  )
                  valid = response.status_code == 200
                  reason = f"Notion preflight HTTP {response.status_code}"
              except requests.RequestException as exc:
                  reason = f"Notion preflight request failed: {type(exc).__name__}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"valid={'true' if valid else 'false'}\n")
              handle.write(f"reason={reason}\n")
          print(reason)
          if not valid:
              print("::warning::Notion audit skipped; Gmail feedback and artifacts remain available through Direct Bridge mode.")
          PY

      - name: Run incremental Eagle audit
        if: steps.notion_preflight.outputs.valid == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '2ca701ec-01ea-4dfb-864f-a2f7175e5e66' }}
          NOTION_VERSION: "2026-03-11"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          STRICT_SCHEMA: "true"
          MAX_ROWS: ${{ inputs.max_rows }}
          URL_CHECK_ENABLED: "true"
          URL_CHECK_TIMEOUT_SECONDS: "12"
          URL_CACHE_LIVE_SECONDS: "86400"
          URL_CACHE_CLOSED_SECONDS: "21600"
          URL_CACHE_UNKNOWN_SECONDS: "10800"
          INCREMENTAL_AUDIT_STATUSES: "PENDING,RECHECK"
          EAGLE_EVIDENCE_FILE: data/policy_evidence.json
          RAG_USE_LLM: ${{ inputs.run_llm_rag }}
          REQUIRE_LLM_RAG: ${{ inputs.require_llm_rag }}
          PROMOTION_REQUIRE_CV_READY: "true"
          CANDIDATE_WORK_RIGHTS: ${{ inputs.candidate_work_rights }}
          OUTCOME_FEEDBACK_FILE: output/gmail_outcomes.json
          STATE_DIR: state
          OUTPUT_DIR: output
          EAGLE_RUN_KEY: ${{ github.run_id }}
        run: python -m eagle.incremental

      - name: Write Direct Bridge status
        if: always()
        env:
          NOTION_VALID: ${{ steps.notion_preflight.outputs.valid }}
          NOTION_REASON: ${{ steps.notion_preflight.outputs.reason }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/integration_status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "gmail_feedback_attempted": True,
                      "notion_audit_ran": os.getenv("NOTION_VALID") == "true",
                      "notion_preflight": os.getenv("NOTION_REASON", "not run"),
                      "fallback": "DIRECT_BRIDGE" if os.getenv("NOTION_VALID") != "true" else "NONE",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Save cross-run URL and Gmail state
        if: always() && hashFiles('state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: eagle-operational-state-v3-${{ github.run_id }}

      - name: Upload audit, candidates and feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            state/
          if-no-files-found: warn
          retention-days: 14

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_final && needs.pipeline.outputs.notion_valid == 'true'
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: notion-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Download validated audit artifact
        uses: actions/download-artifact@v4
        with:
          name: eagle-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-artifact
      - name: Append verified candidates to Final DB
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FINAL_NOTION_DATA_SOURCE_ID: ${{ secrets.FINAL_NOTION_DATA_SOURCE_ID || '2403ff84-448e-4b24-b30d-3ced754b5450' }}
          NOTION_VERSION: "2026-03-11"
          PROMOTION_CANDIDATES_FILE: audit-artifact/output/promotion_candidates.json
          PROMOTION_MANIFEST: output/promotion_manifest.json
          PROMOTE_APPLY: "true"
          PROMOTION_REQUIRE_CV_READY: "true"
        run: python -m eagle.promote
      - name: Upload Final DB promotion manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/promotion_manifest.json
          if-no-files-found: error
          retention-days: 30
