name: Eagle Today100 2026-07-29

on:
  push:
    branches:
      - agent/eagle-today100-20260729
  pull_request:
    branches:
      - main
    paths:
      - 'eagle/today100.py'
      - 'eagle/today100_runner.py'
      - 'eagle/jora_today100.py'
      - 'eagle/jora_card_today100.py'
      - 'eagle/whv_regions.py'
      - 'tests/test_today100.py'
      - 'tests/test_jora_today100.py'
      - 'tests/test_jora_card_today100.py'
      - 'tests/test_cv_clusters.py'
      - '.github/workflows/today100.yml'

permissions:
  contents: read

concurrency:
  group: eagle-today100-20260729-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q eagle main.py
      - name: Run Today100 policy tests
        run: >-
          python -m pytest -q
          tests/test_today100.py
          tests/test_jora_today100.py
          tests/test_jora_card_today100.py
          tests/test_cv_clusters.py
      - name: Collect and audit today's vacancies from Jora cards and detail pages
        id: collector
        continue-on-error: true
        env:
          EAGLE_RUN_DATE: '2026-07-29'
          TARGET_COUNT: '100'
          OUTPUT_DIR: output/today100
          REQUEST_TIMEOUT: '20'
          REQUEST_DELAY: '0.12'
        run: |
          mkdir -p output/today100
          set +e
          python -m eagle.jora_card_today100 2>&1 | tee output/today100/run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload Today100 evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-today100-2026-07-29-${{ github.run_id }}
          path: output/today100/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when collector did not produce 100 auditable rows
        if: steps.collector.outcome == 'failure'
        run: |
          cat output/today100/run.log || true
          cat output/today100/summary.json || true
          exit 1
