name: Eagle Final DB Daily Loop

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Kuala_Lumpur
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      max_new_rows:
        description: Maximum raw vacancies retained from each crawl cycle
        required: true
        default: "50"
        type: string
      max_final_rows:
        description: Maximum verified finalists written to Final DB per cycle
        required: true
        default: "15"
        type: string
      candidate_work_rights:
        description: Australian work-rights state for the run record
        required: true
        default: application_in_progress
        type: choice
        options:
          - application_in_progress
          - granted

permissions:
  contents: read

concurrency:
  group: eagle-final-db-daily-loop
  cancel-in-progress: true

env:
  MAX_NEW_ROWS: ${{ github.event.inputs.max_new_rows || '50' }}
  MAX_FINAL_ROWS: ${{ github.event.inputs.max_final_rows || '15' }}
  CANDIDATE_WORK_RIGHTS: ${{ github.event.inputs.candidate_work_rights || 'application_in_progress' }}

jobs:
  crawl-score-sync-maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Compile and run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q eagle
          python -m pytest -q

      - name: Prepare output directories
        run: mkdir -p output/crawl output/final_sync

      - name: Collect new official and keyword vacancies
        env:
          EAGLE_CRAWL_CONFIG: config/crawl_aug22_2026.yml
          MAX_ROWS: ${{ env.MAX_NEW_ROWS }}
          OUTPUT_DIR: output/crawl
        run: python -m eagle.target_crawl

      - name: Validate Final DB connection
        id: notion_preflight
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FINAL_SOURCE_ID: ${{ secrets.FINAL_NOTION_DATA_SOURCE_ID || '2403ff84-448e-4b24-b30d-3ced754b5450' }}
          NOTION_VERSION: "2026-03-11"
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("NOTION_TOKEN", "").strip()
          source_id = os.getenv("FINAL_SOURCE_ID", "").replace("-", "").strip()
          valid = False
          reason = "NOTION_TOKEN secret is missing"

          if token and source_id:
              try:
                  response = requests.get(
                      f"https://api.notion.com/v1/data_sources/{source_id}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Notion-Version": os.getenv("NOTION_VERSION", "2026-03-11"),
                      },
                      timeout=15,
                  )
                  valid = response.status_code == 200
                  reason = f"Notion preflight HTTP {response.status_code}"
              except requests.RequestException as exc:
                  reason = f"Notion preflight request failed: {exc}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"valid={'true' if valid else 'false'}\n")
              handle.write(f"reason={reason}\n")

          print(reason)
          if not valid:
              print(
                  "::warning::Crawl completed, but Final DB synchronization was skipped. "
                  "Replace NOTION_TOKEN and rerun manually."
              )
          PY

      - name: Score, deduplicate and synchronize Final DB lifecycle
        if: steps.notion_preflight.outputs.valid == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FINAL_NOTION_DATA_SOURCE_ID: ${{ secrets.FINAL_NOTION_DATA_SOURCE_ID || '2403ff84-448e-4b24-b30d-3ced754b5450' }}
          NOTION_VERSION: "2026-03-11"
          EAGLE_CONFIG: config/scoring_aug22_2026.yml
          EAGLE_CRAWL_CONFIG: config/crawl_aug22_2026.yml
          CRAWL_REPORT: output/crawl/crawl_report.json
          OUTPUT_DIR: output/final_sync
          MAX_FINAL_ROWS: ${{ env.MAX_FINAL_ROWS }}
          MAX_EXISTING_RECHECKS: "100"
          STALE_AFTER_DAYS: "14"
          PIPELINE_RUN_ID: EAGLE-${{ github.run_id }}-${{ github.run_attempt }}
          APPLY_CHANGES: "true"
        run: python -m eagle.pipeline_loop

      - name: Write cycle status
        if: always()
        env:
          NOTION_VALID: ${{ steps.notion_preflight.outputs.valid }}
          NOTION_REASON: ${{ steps.notion_preflight.outputs.reason }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("output/workflow_status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(
                  {
                      "run_at": datetime.now(timezone.utc).isoformat(),
                      "cycle": "collect -> live URL gate -> score -> deduplicate -> Final DB lifecycle -> close/stale maintenance",
                      "raw_limit": int(os.getenv("MAX_NEW_ROWS", "50")),
                      "final_limit": int(os.getenv("MAX_FINAL_ROWS", "15")),
                      "candidate_work_rights": os.getenv(
                          "CANDIDATE_WORK_RIGHTS", "application_in_progress"
                      ),
                      "notion_sync_attempted": os.getenv("NOTION_VALID") == "true",
                      "notion_preflight": os.getenv("NOTION_REASON", "not run"),
                      "protected_apply_statuses": ["APPLIED", "INTERVIEW"],
                      "lifecycle": ["NEW", "ACTIVE", "STALE", "CLOSED"],
                      "scheduled_local_time": "17:00 Asia/Kuala_Lumpur",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload cycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-final-db-loop-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
