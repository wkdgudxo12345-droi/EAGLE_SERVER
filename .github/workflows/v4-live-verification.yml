name: Eagle V4 Live Verification

on:
  push:
    branches:
      - agent/eagle-v4-live-verification
    paths:
      - '.github/workflows/v4-live-verification.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v4-live-verification.yml'

permissions:
  contents: read

concurrency:
  group: eagle-v4-live-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eagle main.py
      - name: Run policy smoke test
        run: python -m eagle.smoke
      - name: Run 10-row live read-only verification
        id: eagle
        continue-on-error: true
        env:
          EAGLE_SECRET_CANDIDATES_JSON: ${{ toJSON(secrets) }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '2403ff84-448e-4b24-b30d-3ced754b5450' }}
          NOTION_VERSION: '2026-03-11'
          APPLY_CHANGES: 'false'
          ARCHIVE_REJECTED: 'false'
          STRICT_SCHEMA: 'true'
          MAX_ROWS: '10'
          URL_CHECK_ENABLED: 'true'
          URL_CHECK_TIMEOUT_SECONDS: '12'
          EAGLE_EVIDENCE_FILE: data/policy_evidence.json
          RAG_USE_LLM: 'false'
          REQUIRE_LLM_RAG: 'false'
          RESUME_ENABLED: 'false'
          STATE_DIR: state
          OUTPUT_DIR: output
          EAGLE_RUN_KEY: live-verification-${{ github.run_id }}
          EAGLE_CODE_SHA: ${{ github.sha }}
          SOFT_DEADLINE_SECONDS: '900'
        run: |
          mkdir -p output state "$RUNNER_TEMP/eagle"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          raw = os.environ.get("EAGLE_SECRET_CANDIDATES_JSON", "{}")
          try:
              available = json.loads(raw)
          except json.JSONDecodeError:
              available = {}

          candidates = [
              (name, str(value))
              for name, value in available.items()
              if "NOTION" in name.upper() and str(value).strip()
          ]
          checked_names: list[str] = []
          selected: tuple[str, str] | None = None
          for name, token in sorted(candidates):
              checked_names.append(name)
              try:
                  response = requests.get(
                      "https://api.notion.com/v1/users/me",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Notion-Version": os.environ["NOTION_VERSION"],
                      },
                      timeout=20,
                  )
              except requests.RequestException:
                  continue
              if response.status_code == 200:
                  selected = (name, token)
                  break

          output = Path("output/run.log")
          if selected is None:
              names = ", ".join(checked_names) if checked_names else "none"
              output.write_text(
                  "No valid Notion integration token was found in GitHub Secrets.\n"
                  f"Notion-named secrets checked: {names}.\n",
                  encoding="utf-8",
              )
              raise SystemExit(2)

          name, token = selected
          token_path = Path(os.environ["RUNNER_TEMP"]) / "eagle" / "notion-token"
          token_path.write_text(token, encoding="utf-8")
          token_path.chmod(0o600)
          output.write_text(
              f"Using valid Notion credential from secret: {name}\n",
              encoding="utf-8",
          )
          PY
          auth_status=$?
          if [ "$auth_status" -ne 0 ]; then
            cat output/run.log
            echo "status=$auth_status" >> "$GITHUB_OUTPUT"
            exit "$auth_status"
          fi
          export NOTION_TOKEN="$(cat "$RUNNER_TEMP/eagle/notion-token")"
          rm -f "$RUNNER_TEMP/eagle/notion-token"
          set +e
          python -m eagle 2>&1 | tee -a output/run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload live verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eagle-v4-live-verification-${{ github.run_id }}
          path: |
            output/
            state/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when live verification fails
        if: steps.eagle.outcome == 'failure'
        run: |
          cat output/run.log || true
          exit 1
