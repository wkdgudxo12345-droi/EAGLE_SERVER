name: Notion Live Connection Smoke

on:
  pull_request:
    paths:
      - .github/workflows/notion-live-smoke.yml
      - eagle/incremental.py
      - eagle/notion.py
      - eagle/record.py

permissions:
  contents: read

jobs:
  notion-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify GitHub token and read existing Notion source
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || '2ca701ec-01ea-4dfb-864f-a2f7175e5e66' }}
          NOTION_VERSION: "2026-03-11"
          STRICT_SCHEMA: "true"
          MAX_ROWS: "5"
          URL_CHECK_ENABLED: "false"
          INCREMENTAL_AUDIT_STATUSES: "PENDING,RECHECK"
          EAGLE_EVIDENCE_FILE: data/policy_evidence.json
          RAG_USE_LLM: "false"
          REQUIRE_LLM_RAG: "false"
          PROMOTION_REQUIRE_CV_READY: "true"
          CANDIDATE_WORK_RIGHTS: "application_in_progress"
          STATE_DIR: state
          OUTPUT_DIR: output
          EAGLE_RUN_KEY: notion-live-smoke
        run: python -m eagle.incremental
      - name: Upload connection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-live-smoke-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
